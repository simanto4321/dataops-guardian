# One-command full stack: PostgreSQL warehouse + FastAPI control plane + web UI.
#   docker compose up --build
# Then open http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dataops
      POSTGRES_PASSWORD: dataops
      POSTGRES_DB: dataops
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataops"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - dbdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATAOPS_DATABASE_URL: postgresql+psycopg://dataops:dataops@db:5432/dataops
      DATAOPS_CORS_ORIGINS: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  dbdata:
